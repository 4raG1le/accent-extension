<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 250px;
      padding: 15px;
      font-family: Arial, sans-serif;
    }
    h3 {
      margin: 0 0 15px 0;
      color: #333;
    }
    button {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background-color: #45a049;
    }
    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
    #status {
      margin-top: 10px;
      padding: 8px;
      background-color: #f0f0f0;
      border-radius: 4px;
      font-size: 12px;
      color: #666;
    }
    #wordList {
      max-height: 200px;
      overflow-y: auto;
      margin-top: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    .word-item {
      padding: 5px;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .word-item:last-child {
      border-bottom: none;
    }
    .remove-word {
      color: #ff4444;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }
    .remove-word:hover {
      color: #cc0000;
    }
  </style>
</head>
<body>
  <h3>Ударение в словах</h3>
  <button id="selectStress">Выбрать ударение</button>
  <button id="clearSelection" disabled>Отмена</button>
  
  <div id="status">Готов к работе</div>
  
  <div style="margin-top: 15px;">
    <strong>Слова с ударением:</strong>
    <div id="wordList"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
